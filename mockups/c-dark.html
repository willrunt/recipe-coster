<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>C — Dark Bench</title>
<script src="data.js"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1d212a; --ink:#f2f4f7; --muted:#8a92a3;
    --accent:#ffb84d; --buy:#ff8a5c; --green:#4ade80; --line:#262b35;
    --ease-out:cubic-bezier(0.23,1,0.32,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#05060a;color:var(--ink);display:flex;justify-content:center;padding:24px}
  .phone{width:390px;height:800px;background:var(--bg);border-radius:38px;overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;position:relative}
  header{padding:54px 20px 16px}
  h1{font-size:26px;font-weight:720;letter-spacing:-.02em}
  header p{color:var(--muted);font-size:13px;margin-top:3px}
  main{flex:1;overflow-y:auto;padding:4px 14px 16px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--panel);border-radius:16px;padding:15px 16px;margin-bottom:10px;cursor:pointer;
    border:1px solid var(--line);transition:transform 150ms var(--ease-out),background 150ms}
  .row:active{transform:scale(.985);background:var(--panel2)}
  .name{font-weight:600;font-size:15.5px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:12.5px;margin-top:4px}
  .price{text-align:right;white-space:nowrap}
  .total{font-weight:720;font-size:17px;font-variant-numeric:tabular-nums;color:var(--accent)}
  .buy{display:inline-block;margin-top:5px;font-size:11px;font-weight:600;color:var(--buy);
    background:rgba(255,138,92,.13);padding:2px 8px;border-radius:99px}
  nav{display:flex;border-top:1px solid var(--line);background:var(--bg)}
  nav button{flex:1;border:0;background:none;padding:13px 0 26px;font:inherit;font-size:12px;
    color:var(--muted);font-weight:600;cursor:pointer}
  nav button.on{color:var(--accent)}
  .detail{position:absolute;inset:0;background:var(--bg);transform:translateX(100%);
    transition:transform 260ms var(--ease-out);display:flex;flex-direction:column}
  .detail.show{transform:translateX(0)}
  .dhead{padding:54px 20px 18px;border-bottom:1px solid var(--line)}
  .back{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;
    font-size:14px;margin-bottom:14px;cursor:pointer;padding:0}
  .dhead h2{font-size:22px;font-weight:720;letter-spacing:-.02em;line-height:1.18}
  .stats{display:flex;gap:10px;margin-top:18px}
  .stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
  .stat .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .stat .v{font-size:18px;font-weight:720;font-variant-numeric:tabular-nums;margin-top:3px}
  .stat .v.acc{color:var(--accent)} .stat .v.buy{color:var(--buy)}
  .lines{flex:1;overflow-y:auto;padding:12px 14px}
  .li{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;font-size:14.5px}
  .li.owned{opacity:.5}
  .li.owned .lname{text-decoration:line-through}
  .q{color:var(--muted);font-size:12.5px;margin-left:7px}
  .lcost{font-weight:650;font-variant-numeric:tabular-nums;color:var(--accent)}
  .check{color:var(--green);font-size:12px;font-weight:650;margin-left:7px}
</style>
</head>
<body>
<div class="phone">
  <header><h1>Recipe Coster</h1><p>39 recipes · avg $16.27 · 3 in pantry</p></header>
  <main id="list"></main>
  <nav><button class="on">Recipes</button><button>Pantry</button><button>↻ Refresh</button></nav>

  <section class="detail" id="detail">
    <div class="dhead">
      <button class="back" onclick="hide()">← Recipes</button>
      <h2 id="dname"></h2>
      <div class="stats">
        <div class="stat"><div class="k">Total</div><div class="v acc" id="dtotal"></div></div>
        <div class="stat"><div class="k">/ serve</div><div class="v" id="dserve"></div></div>
        <div class="stat"><div class="k">To buy</div><div class="v buy" id="dbuy"></div></div>
      </div>
    </div>
    <div class="lines" id="dlines"></div>
  </section>
</div>
<script>
  const money=n=>'$'+n.toFixed(2);
  const list=document.getElementById('list');
  RECIPES.forEach(r=>{
    const el=document.createElement('div');el.className='row';
    el.innerHTML=`<div><div class="name">${r.name}</div>
      <div class="sub">${r.lines.length} ingredients · ${r.serves} serves</div></div>
      <div class="price"><div class="total">${money(r.total)}</div>
      ${r.toBuy<r.total?`<div class="buy">${money(r.toBuy)} to buy</div>`:''}</div>`;
    el.onclick=()=>show(r);list.appendChild(el);
  });
  function show(r){
    dname.textContent=r.name;dtotal.textContent=money(r.total);
    dserve.textContent=money(r.total/r.serves);dbuy.textContent=money(r.toBuy);
    dlines.innerHTML=r.lines.map(l=>`<div class="li ${l.pantry?'owned':''}">
      <div><span class="lname">${l.name}</span><span class="q">${l.qty}</span>${l.pantry?'<span class="check">✓ pantry</span>':''}</div>
      <div class="lcost">${l.pantry?'—':money(l.cost)}</div></div>`).join('');
    detail.classList.add('show');
  }
  function hide(){detail.classList.remove('show')}
</script>
</body>
</html>
