<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#758467" />
  <title>Recipe Coster</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Belleza&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
</head>
<body>
  <header>
    <h1>Recipe Coster</h1>
    <p id="subtitle">Loading…</p>
    <div id="status" class="status hidden"></div>
  </header>

  <main>
    <section id="view-recipes" class="view">
      <div class="controls">
        <input id="search" type="search" placeholder="Search recipes…" autocomplete="off" />
        <select id="sort">
          <option value="default">Sheet order</option>
          <option value="cost-asc">Cost ↑</option>
          <option value="cost-desc">Cost ↓</option>
          <option value="buy-desc">To buy ↓</option>
          <option value="name">Name A–Z</option>
        </select>
      </div>
      <div id="recipe-list"></div>
    </section>
    <section id="view-pantry" class="view hidden"></section>
  </main>

  <nav>
    <button data-view="recipes" class="on">Recipes</button>
    <button data-view="pantry">Pantry</button>
    <button id="refresh">↻ Refresh</button>
  </nav>

  <section class="detail" id="detail" aria-hidden="true">
    <div class="dhead">
      <button class="back" id="back">← Recipes</button>
      <h2 id="dname"></h2>
      <div class="stats">
        <div class="stat"><div class="k">Total</div><div class="v acc" id="dtotal"></div></div>
        <div class="stat"><div class="k">/ serve</div><div class="v" id="dserve"></div></div>
        <div class="stat"><div class="k">To buy</div><div class="v buy" id="dbuy"></div></div>
      </div>
      <p id="dwarn" class="warn hidden">⚠️ Some lines unpriced — totals incomplete</p>
    </div>
    <div class="lines" id="dlines"></div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
